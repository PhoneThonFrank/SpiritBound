<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiritBound | Quiz</title>

    <link rel="shortcut icon" href="../assets/images/SpiritBound.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="../css/lesson.css">
    <link rel="stylesheet" href="../css/designs.css">
</head>

<body>

    <div class="custom-lesson-navbar">

        <h3 class="text-white mt-2 rounded px-1 ps-5">SpiritBound</h3>
        <div class="nav-lg tools text-white">
            <!-- <button class="btn me-2"><img src="./assets/images/lesson/heart.png" alt="heart" width="25px"><span
                    class="ms-2">5</span></button> -->
            <button class="btn me-2 d-none"><img src="../assets/images/lesson/star.png" alt="points" width="25px"><span
                    class="ms-2" id="pointDisplay">0</span></button>
            <button class="btn btn-danger me-5" id="exitButton">Exit</button>
        </div>

    </div>

    <div id="countdown-overlay" style="display: none;">
        <div id="countdown-text">3</div>
    </div>
    <!-- Sound Effects -->
    <audio src="./sounds/start.mp3" id="startSound" hidden></audio>
    <audio src="./sounds/power_up.m4a" id="powerupSound" hidden></audio>
    <audio src="./sounds/add_time_sound.mp3" id="addTimeSound" hidden></audio>
    <audio src="./sounds/finish.mp3" id="finishSound" hidden></audio>
    <audio src="./sounds/correct.mp3" id="correctSound" hidden></audio>
    <audio src="./sounds/oops.m4a" id="incorrectSound" hidden></audio>
    <audio src="./sounds/timer_counting.m4a" id="timerSound" hidden></audio>
    <audio src="./sounds/warning.mp3" id="warningSound" hidden></audio>
    <audio src="./sounds/alarm.m4a" id="alarmSound" hidden></audio>
    <audio src="./sounds/congratulations.m4a" id="congratulationSound" hidden></audio>
    <audio src="./sounds/try_again.m4a" id="tryagainSound" hidden></audio>
    <audio src="./sounds/background_music.MP3" id="bgmSound" loop hidden></audio>
    <audio src="./sounds/countdown-sound.m4a" id="countdownSound" hidden></audio>

    <!-- Intro Modal -->
    <div class="modal fade" id="introModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="introModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white !important;">
                <div class="modal-body bg-light">
                    <div class="py-3 text-center" id="introModalContent">
                        <img src="../assets/images/SpiritBound.png" alt="SpiritBound" width="100px" class="m-auto">
                        <h3 class="mt-2"><q id="quizDisplayTitle" class="text-success"></q></h3>
                        <p class="my-3 text-muted">Powered by SpiritBound</p>
                        <button class="btn btn-success btn-lg">Start</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Correct Modal -->
    <div class="modal fade" id="correctModal" tabindex="-1" aria-labelledby="correctModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white !important;">
                <h2 class="text-center text-success my-2" id="addPoints"></h2>
                <div class="modal-body bg-success">
                    <h1 class="text-light text-center">Correct!</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Incorrect Modal -->
    <div class="modal fade" id="incorrectModal" tabindex="-1" aria-labelledby="incorrectModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white !important;">
                <h2 class="text-center text-danger d-none" id="removePoints"></h2>
                <div class="modal-body bg-danger" style="background-color: red !important;">
                    <h1 class="text-light text-center">Wrong!</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="loadingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white !important;">
                <div class="modal-body bg-light">
                    <div class="d-flex justify-content-center my-5">
                        <div class="spinner-border text-success" role="status" style="width: 70px; height: 70px;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <h3 class="w-100 text-center text-success">Calculating Results...</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal fade" id="resultModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="resultModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white !important;">
                <!-- <img src="./images/akmm.png" alt="speaker" width="250px" class="d-block m-auto position-fixed bottom-0 start-0"> -->
                <div class="modal-body bg-light text-center">
                    <div id="resultsCon" class="py-3">
                        <h4 class="text-success">Results</h4>
                        <p class="my-3 text-muted">You answered 0 out of 0 correctly.</p>
                        <h1 class="display-3 my-4" style="color: var(--accent-color); font-weight: bolder;">0 Points
                        </h1>
                        <button class="btn btn-success btn-lg mx-2">Retry</button><button
                            class="btn btn-success btn-lg mx-2" id="nextChapButton" style="display: none;">Next
                            Chapter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body bg-warning">
                    <h1 class="text-light text-center" id="alertMessage"></h1>
                </div>
            </div>
        </div>
    </div>





    <div class="quiz-wrapper">
        <div class="quiz-header">
            <div class="power-ups d-none">
                <div class="power-up-item">
                    <button id="doublePointsBtn" class="power-up-btn" title="Double Points (2x)">
                        <i class="bi bi-gem"></i>
                    </button>
                    <span class="power-up-label">2x Points</span>
                </div>
                <div class="power-up-item">
                    <button id="addTimeBtn" class="power-up-btn" title="Add 1 Minute">
                        <i class="bi bi-clock-history"></i>
                    </button>
                    <span class="power-up-label">+1 Minute</span>
                </div>
                <div class="power-up-item">
                    <button id="highStakesBtn" class="power-up-btn" title="High Stakes (+2x / -2x)">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </button>
                    <span class="power-up-label">High Stakes</span>
                </div>
            </div>
            <div class="d-flex timer-points-container">
                <div id="timer" class="me-2 d-none">00:00</div>
                <button class="btn btn-success" style="width: 50px; height: 50px;" id="volumeBtn"><i class="bi bi-volume-up fw-bold" style="font-size: 20px;"></i></button>
                <div id="points"><img src="../assets/images/lesson/star.png" alt="star point" width="30px"></div>
            </div>
        </div>
        <div class="alert alert-warning m-auto mb-3 text-center py-1" id="powerUpAlertBox"
            style="border-radius: 15px; width: 300px;"></div>
        <div id="quiz-container">
            <div class="card">
                <div class="card-header" id="question-counter">
                    Question 1 of 5
                </div>
                <div class="card-body p-4">
                    <h5 class="card-title mb-4" id="question-text">
                        Loading question...
                    </h5>
                    <div id="options-container"></div>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button id="next-btn" class="btn">Next</button>
            </div>
        </div>

        <div id="results-container" class="d-none">
            <div class="card p-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" id="results-title">Quiz Complete!</h2>
                    <p id="score-text">You answered 0 out of 5 correctly.</p>
                    <p id="points-text" class="my-4">0 Points</p>
                    <button id="restart-btn" class="btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./script.js" type="module"></script>

</html>
